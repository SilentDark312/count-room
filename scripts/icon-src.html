<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin:0; padding:0; }
  .icon {
    width:100vw; height:100vh;
    background: radial-gradient(120% 100% at 50% 0%, #1b5241, #123d2e 60%, #081f19);
    display:flex; align-items:center; justify-content:center;
  }
  /* apple-touch-icon: iOS applies its own rounding/shine, so keep this flat and solid */
  .icon.solid { background:#0d2f24; }
  .spade { width:62%; height:62%; }
  /* maskable icons get cropped to arbitrary shapes by the OS -- keep the mark
     inside the ~80%-diameter "safe zone" circle by shrinking and centering it */
  .icon.safe .spade { width:46%; height:46%; }
  svg { width:100%; height:100%; display:block; }
</style>
</head>
<body>
  <div class="icon" id="iconRoot">
    <div class="spade">
      <svg viewBox="0 0 100 100">
        <path d="M50 6
                 C 30 24, 6 34, 6 54
                 C 6 68, 18 76, 32 76
                 C 39 76, 45 73, 49 68
                 C 47 82, 40 90, 27 94
                 L 73 94
                 C 60 90, 53 82, 51 68
                 C 55 73, 61 76, 68 76
                 C 82 76, 94 68, 94 54
                 C 94 34, 70 24, 50 6 Z"
              fill="#e7c65a"/>
      </svg>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const root = document.getElementById('iconRoot');
    if (params.has('safe')) root.classList.add('safe');
    if (params.has('solid')) root.classList.add('solid');
  </script>
</body>
</html>
