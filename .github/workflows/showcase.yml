name: Update showcase

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "scripts/record-showcase.mjs"
      - ".github/workflows/showcase.yml"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Record showcase walkthrough
        run: node scripts/record-showcase.mjs

      - name: Ensure ffmpeg is present
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Convert recording to GIF and MP4
        run: |
          mkdir -p docs
          ffmpeg -y -i videos/showcase.webm \
            -vf "fps=12,scale=430:-1:flags=lanczos,split[s0][s1];[s0]palettegen[p];[s1][p]paletteuse" \
            docs/showcase.gif
          ffmpeg -y -i videos/showcase.webm \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            docs/showcase.mp4

      - name: Commit showcase assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/showcase.gif docs/showcase.mp4
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update showcase demo [skip ci]"
            git pull --rebase origin master
            git push
          fi
